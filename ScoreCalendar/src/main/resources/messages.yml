# ============================================================================
#  ScoreCalendar - messages
#  Formats: &a legacy codes, &#00B2FF hex colors, and MiniMessage
#  (<gradient:#00B2FF:#00A6FC>text</gradient>, <bold>, <italic>) when enabled in config.yml.
#  %prefix% is replaced with the prefix below. Set a message to "" to disable it.
#  Every key can also be overridden per calendar in the calendar's own "messages:" section.
#  Lists are sent as several lines.
# ============================================================================
messages:
  prefix: "&#00B2FF&lSCORESMP &#898989> "

  # ---------------------------------------------------------------- claiming
  reward-claimed: "%prefix%&7You claimed &aDay %day%&7! &8(&f%days_claimed%&7/&f%days_total%&8)"
  reward-locked: "%prefix%&cThis reward is not unlocked yet! &7Unlocks in &f%unlock_countdown%&7."
  daily-locked: "%prefix%&cYou can claim this reward later! &7Claim your rewards in order, one per day."
  already-claimed: "%prefix%&cYou have already claimed this reward!"
  reward-missed: "%prefix%&cYou missed this reward."
  calendar-closed: "%prefix%&cThis calendar is currently closed!"
  calendar-not-open-yet: "%prefix%&7%calendar_name% &7opens in &f%opens_in%&7!"
  calendar-no-access: "%prefix%&cYou do not have access to this calendar!"
  day-no-permission: "%prefix%&cThis reward requires a rank you do not have."
  claim-error: "%prefix%&cSomething went wrong while claiming. Nothing was lost - please try again."
  data-loading: "%prefix%&7Your calendar data is loading, please try again in a moment."
  data-error: "%prefix%&cCould not load your calendar data. Please contact staff."

  # ---------------------------------------------------------------- delivery
  rewards-stored: "%prefix%&eYour inventory is full! &7%count% reward item(s) were stored. Use &f/calendar collect &7to get them."
  rewards-delivered: "%prefix%&aDelivered %count% stored reward item(s) to your inventory."
  rewards-still-stored: "%prefix%&e%count% reward item(s) are still stored. Free some space and use &f/calendar collect&e."
  rewards-waiting: "%prefix%&7You have &f%count% &7stored reward(s) waiting. Use &f/calendar collect&7."
  inventory-full: "%prefix%&cYour inventory is full!"

  # ---------------------------------------------------------------- general
  no-permission: "%prefix%&cYou do not have permission to do this!"
  players-only: "%prefix%&cOnly players can use this."
  calendar-not-found: "%prefix%&cThere is no calendar called &f%calendar%&c."
  no-calendars: "%prefix%&cThere are no calendars yet."
  no-open-calendars: "%prefix%&cThere is no open calendar right now."
  menu-not-found: "%prefix%&cMenu &f%menu% &cdoes not exist."
  feature-disabled: "%prefix%&cThis feature is disabled."
  player-not-found: "%prefix%&cPlayer &f%player% &cwas not found."
  invalid-day: "%prefix%&c'%day%' is not a valid day (1-%days%)."
  preview-opened: "%prefix%&7Preview of %calendar_name% &8- &7nothing can be claimed."
  preview-no-claim: "%prefix%&7Preview mode: rewards cannot be claimed here."
  info:
    - "&8&m                                        "
    - "  %calendar_name%"
    - "  &7Status: %status%"
    - "  &7Days: &f%days_total% &8| &7Unlocked: &f%days_unlocked% &8| &7Claimed: &f%days_claimed%"
    - "  &7Next reward: &fDay %next_day% &7in &f%next_unlock%"
    - "  &7Opens: &f%opens_at% &8| &7Closes: &f%closes_at%"
    - "  &7Timezone: &f%timezone%"
    - "&8&m                                        "
  help:
    - "&#00B2FF&lSCORECALENDAR"
    - "&f/calendar &8- &7open the current calendar"
    - "&f/calendar <name> &8- &7open a calendar"
    - "&f/calendars &8- &7all calendars"
    - "&f/calendar rewards [name] &8- &7rewards overview"
    - "&f/calendar collect &8- &7collect stored rewards"
    - "&f/calendar info [name] &8- &7calendar information"
  help-admin:
    - "&#00B2FF&lSCORECALENDAR ADMIN"
    - "&f/calendar admin &8- &7admin menu"
    - "&f/calendar admin create <name> [days] [type]"
    - "&f/calendar admin delete|edit|preview <name>"
    - "&f/calendar admin open|close|auto <name>"
    - "&f/calendar admin give <player> <calendar> <day>"
    - "&f/calendar admin reset <player> <calendar>"
    - "&f/calendar admin resetall <calendar>"
    - "&f/calendar admin setday <player> <calendar> <day>"
    - "&f/calendar admin unlockday|lockday|autoday <calendar> <day>"
    - "&f/calendar admin history <player>"
    - "&f/calendar admin reload|backup|problems"

  # ---------------------------------------------------------------- placeholders
  status-open: "&aOpen"
  status-closed: "&cClosed"
  never: "never"
  no-next-unlock: "no more rewards"
  unlock-unknown: "not scheduled"
  unlocked-now: "now"
  placeholder-true: "yes"
  placeholder-false: "no"
  reward-item-line: "&8 • &7%item%"
  reward-status-locked: "&cLocked"
  reward-status-available: "&aAvailable"
  reward-status-claimed: "&cAlready claimed"
  reward-status-missed: "&8Missed"

  # ---------------------------------------------------------------- menus
  button-back: "&7« Back"
  button-back-lore: []
  button-close: "&cClose"
  button-next-page: "&#00B2FF&lNEXT »"
  button-previous-page: "&#00B2FF&l« PREVIOUS"
  button-page-lore: "&7Go to page %page%/%pages%"
  button-stored-rewards: "&#00B2FF&lSTORED REWARDS"
  button-stored-rewards-lore: "&7You have &f%count% &7stored reward(s)."
  button-open-calendar: "&#00B2FF&lOPEN CALENDAR"
  preview-title: "&#00B2FF&lDAY %day% &8» &f%reward_name%"
  preview-commands: "&7+ &f%count% &7special reward(s)"
  preview-empty: "&8This day has no reward yet."
  overview-title: "&#00B2FF&lREWARDS &8» %calendar_name% &8(%page%/%pages%)"
  overview-item-name: "&#00B2FF&lDAY %day% &8» &f%reward_name%"
  overview-item-lore:
    - "%reward_lore%"
    - "%reward_items%"
    - ""
    - "&7Status: %reward_status%"
    - "&7Unlocks: &f%unlock_date%"
    - ""
    - "&#00B2FFClick to preview"
  pending-click-collect: "&#00B2FFClick to collect"
  pending-collect-all: "&a&lCOLLECT ALL"
  pending-collect-all-lore: "&7Collect all %count% stored reward(s)."
  pending-info: "&#00B2FF&lSTORED REWARDS"
  pending-info-lore:
    - "&7Rewards that did not fit in your"
    - "&7inventory are kept here safely."
    - ""
    - "&7Stored: &f%count%"
  pending-none: "&a&lNO STORED REWARDS"
  pending-none-lore:
    - "&7Everything has been delivered!"
  progress-title: "&#00B2FF&lPROGRESS &8» %calendar_name%"
  progress-bar-done: "&a&l%progress%%"
  progress-bar-todo: "&7&l%progress%%"
  progress-bar-lore:
    - "&7Claimed &f%days_claimed%&7/&f%days_total% &7rewards"
  progress-stats-name: "%calendar_name%"
  progress-stats-lore:
    - "&7Claimed: &f%days_claimed%&7/&f%days_total%"
    - "&7Unlocked: &f%days_unlocked%"
    - "&7Still to claim: &f%days_unclaimed%"
    - "&7Remaining: &f%days_remaining%"
  progress-next-name: "&#00B2FF&lNEXT REWARD"
  progress-next-lore:
    - "&7Day &f%next_day% &7unlocks in &f%next_unlock%"
    - "&7(%next_unlock_date%)"
  confirm-title: "&c&lARE YOU SURE?"
  confirm-yes: "&a&lCONFIRM"
  confirm-no: "&c&lCANCEL"

  # ---------------------------------------------------------------- admin
  admin-reload: "%prefix%&aConfigurations successfully reloaded! &7(%calendars% calendars)"
  config-ok: "%prefix%&aNo configuration problems found."
  config-problems: "%prefix%&eConfiguration problems: &c%errors% error(s)&e, %warnings% warning(s). Details are also in the console:"
  config-problems-more: "&7... and %count% more (see console or /calendar admin problems)"
  create-usage: "%prefix%&7Usage: &f/calendar admin create <name> [days] [ADVENT|SEASONAL|CUSTOM|DAILY|WEEKLY]"
  create-invalid-name: "%prefix%&c'%calendar%' is not a valid name. Use 1-32 lowercase letters, numbers, - or _."
  create-exists: "%prefix%&cA calendar called &f%calendar% &calready exists."
  create-success: "%prefix%&aCreated calendar &f%calendar% &a(%days% days, %type%). &7File: &f%file%"
  create-failed: "%prefix%&cCould not create the calendar: %error%"
  delete-success: "%prefix%&aDeleted calendar &f%calendar%&a. The file was moved to &f%file%&a."
  delete-failed: "%prefix%&cCould not delete &f%calendar%&c: %file%"
  confirm-command: "%prefix%&eType &f%command% &ewithin 30 seconds to confirm."
  usage-delete: "%prefix%&7Usage: &f/calendar admin delete <name>"
  usage-edit: "%prefix%&7Usage: &f/calendar admin edit <name>"
  usage-preview: "%prefix%&7Usage: &f/calendar admin preview <name>"
  usage-open: "%prefix%&7Usage: &f/calendar admin open|close|auto <name>"
  usage-give: "%prefix%&7Usage: &f/calendar admin give <player> <calendar> <day>"
  usage-reset: "%prefix%&7Usage: &f/calendar admin reset <player> <calendar>"
  usage-resetall: "%prefix%&7Usage: &f/calendar admin resetall <calendar>"
  usage-setday: "%prefix%&7Usage: &f/calendar admin setday <player> <calendar> <day>"
  usage-unlockday: "%prefix%&7Usage: &f/calendar admin unlockday|lockday|autoday <calendar> <day>"
  usage-history: "%prefix%&7Usage: &f/calendar admin history <player>"
  admin-give: "%prefix%&aGave &f%player% &athe reward of &f%calendar% &aday &f%day%&a."
  admin-give-failed: "%prefix%&cCould not give the reward (see console)."
  admin-reset: "%prefix%&aReset &f%player%&a's progress in &f%calendar% &7(%count% claims removed)."
  admin-resetall: "%prefix%&aReset everyone's progress in &f%calendar% &7(%count% claims removed)."
  admin-setday: "%prefix%&aSet &f%player%&a's progress in &f%calendar% &ato day &f%day%&a."
  admin-action-failed: "%prefix%&cThe action failed (see console)."
  admin-state-force-open: "%prefix%&aCalendar &f%calendar% &ais now forced &lOPEN&a."
  admin-state-force-closed: "%prefix%&cCalendar &f%calendar% &cis now forced &lCLOSED&c."
  admin-state-auto: "%prefix%&7Calendar &f%calendar% &7now follows its schedule."
  admin-day-unlocked: "%prefix%&aDay &f%day% &aof &f%calendar% &ais now unlocked."
  admin-day-locked: "%prefix%&cDay &f%day% &cof &f%calendar% &cis now locked."
  admin-day-auto: "%prefix%&7Day &f%day% &7of &f%calendar% &7now follows the schedule."
  history-header: "%prefix%&7Claims of &f%player% &7(%count%):"
  backup-done: "%prefix%&aDatabase backup written: &f%file%"
  backup-failed: "%prefix%&cBackup failed: %file%"

  # ---------------------------------------------------------------- editors
  editor-saved: "%prefix%&aSaved changes to &f%calendar%&a."
  editor-cancelled: "%prefix%&7Changes discarded."
  editor-closed-unsaved: "%prefix%&7Editor closed without saving. Your own items were returned."
  editor-save-failed: "%prefix%&cCould not save: %error%"
  editor-no-session: "%prefix%&cYou have no open layout editor."
  editor-layout-paused: "%prefix%&eYou have unsaved layout changes. Use the chat buttons or &f/calendar admin editor open&e."
  reward-saved: "%prefix%&aSaved the reward of &f%calendar% &aday &f%day% &7(%items% items, %commands% commands)."
  input-hint: "&7Type &fcancel &7to abort. (%seconds%s)"
  input-cancelled: "%prefix%&7Input cancelled."
  input-timeout: "%prefix%&7Input timed out."
  input-invalid: "%prefix%&cInvalid value: %error%"
  input-not-number: "%prefix%&cPlease type a valid number."
  input-create: "%prefix%&7Type: &f<name> [days] [type] &7(e.g. &feaster 14 ADVENT&7)"
  input-player: "%prefix%&7Type the player's name:"
  input-display-name: "%prefix%&7Type the new display name (colors allowed, e.g. &f&#00B2FF&lMY CALENDAR&7):"
  input-days: "%prefix%&7Type the number of days:"
  input-name: "%prefix%&7Type the name (colors allowed):"
  input-lore: "%prefix%&7Type the lore. Separate lines with &f|&7:"
  input-material: "%prefix%&7Type a material (e.g. &fDIAMOND&7):"
  input-amount: "%prefix%&7Type the amount (1-99) or &f%day%&7:"
  input-number: "%prefix%&7Type a number:"
  input-command: "%prefix%&7Type the console command without / (placeholders: %player% %uuid% %day% %calendar%):"
  input-action: "%prefix%&7Type an action, e.g. &fCLOSE&7, &fMESSAGE:&aHi&7, &fCONSOLE_COMMAND:give %player% diamond 1&7, &fOPEN_MENU:rewards"
  input-item-id: "%prefix%&7Type a name for the new button (e.g. &fwebsite&7):"
  input-timezone: "%prefix%&7Type a timezone (e.g. &fEurope/Stockholm&7):"
  input-date: "%prefix%&7Type a date as &fYYYY-MM-DD &7(e.g. 2026-12-01):"
  input-time: "%prefix%&7Type a time as &fHH:MM &7(e.g. 00:00):"
  input-datetime: "%prefix%&7Type a date and time as &fYYYY-MM-DD HH:MM&7:"
  input-duration: "%prefix%&7Type a duration (e.g. &f24h&7, &f1d 12h&7) or &funlimited&7:"
