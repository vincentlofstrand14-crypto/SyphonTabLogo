# ============================================================================
#  ScoreCalendar example: Summer calendar (30 days, two pages)
#  Shows a SEASONAL calendar whose days continue on a second page with navigation buttons.
# ============================================================================
enabled: true
display-name: "&e&lSUMMER CALENDAR"
description:
  - "&730 days of summer rewards!"
type: SEASONAL
days: 30
priority: 50
icon:
  material: SUNFLOWER
  name: "&e&lSummer Calendar"

unlock:
  type: DAILY
  timezone: Europe/Stockholm
  start-date: "2027-06-15"
  start-time: "12:00"
  end-date: "2027-07-14"

claiming:
  claim-window: unlimited
  reset: NEVER

gui:
  title: "&e&lSUMMER CALENDAR &8(%page%/%pages%)"
  size: 54
  # 28 slots per page: days 29 and 30 continue on page 2
  day-slots: "10-16,19-25,28-34,37-43"
  background:
    enabled: true
    material: YELLOW_STAINED_GLASS_PANE
    name: " "
  items:
    previous-page:
      slot: 48
      material: ARROW
      name: "&e&l« PREVIOUS PAGE"
      lore: ["&7Page %page%/%pages%"]
      visible: HAS_PREVIOUS_PAGE
      actions: ["PREVIOUS_PAGE", "SOUND:ITEM_BOOK_PAGE_TURN"]
    next-page:
      slot: 50
      material: ARROW
      name: "&e&lNEXT PAGE »"
      lore: ["&7Page %page%/%pages%"]
      visible: HAS_NEXT_PAGE
      actions: ["NEXT_PAGE", "SOUND:ITEM_BOOK_PAGE_TURN"]
    close:
      slot: 49
      material: BARRIER
      name: "&cClose"
      actions: ["CLOSE"]
    rewards:
      slot: 53
      material: CHEST_MINECART
      name: "&e&lALL REWARDS"
      actions: ["OPEN_MENU:rewards"]

day-items:
  locked:
    material: WHITE_STAINED_GLASS_PANE
    amount: "%day%"
    name: "&7&lDAY %day%"
    lore: ["&7Unlocks in &f%unlock_countdown%", "", "&cLocked"]
  available:
    material: ORANGE_STAINED_GLASS_PANE
    amount: "%day%"
    name: "&e&lDAY %day%"
    glow: true
    lore: ["&7Reward: &f%reward_name%", "", "&aClick to claim!"]
  claimed:
    material: LIGHT_BLUE_STAINED_GLASS_PANE
    amount: "%day%"
    name: "&b&lDAY %day%"
    lore: ["&7Claimed"]

day-styles:
  special:
    available:
      material: SUNFLOWER
      name: "&6&lMIDSUMMER - DAY %day%"

